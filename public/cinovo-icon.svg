<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0d0d0d"/>

  <!-- Film strip holes top -->
  <rect x="7" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="16" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="25" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="34" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="43" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="52" y="6" width="5" height="4" rx="1" fill="#1a1a1a"/>

  <!-- Film strip holes bottom -->
  <rect x="7" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="16" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="25" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="34" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="43" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="52" y="54" width="5" height="4" rx="1" fill="#1a1a1a"/>

  <!-- Stylized C arc -->
  <path
    d="M44 17 A18 18 0 1 0 44 47"
    stroke="url(#cg)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Play triangle accent -->
  <polygon points="39,32 34,27 34,37" fill="url(#cg)" opacity="0.9" filter="url(#glow)"/>
</svg>
